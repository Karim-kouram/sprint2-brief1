<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon Dex</title>
  <link rel="stylesheet" href="./dist/output.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-ground font-body text-ink">

  <!-- ===================== EN-TÊTE ===================== -->
  <header class="bg-ink text-white">
    <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-8 py-5">
      <div class="flex items-center gap-3">
        <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-brand">
          <svg aria-hidden="true" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </div>
        <div>
          <p class="font-display text-2xl font-extrabold leading-none">Mon Dex</p>
          <p class="text-sm text-gray-300">Pokémon · <span id="creature-count">21</span> créatures</p>
        </div>
      </div>
      <nav aria-label="Navigation principale" class="flex flex-wrap gap-2">
        <a href="#grid" class="rounded-full bg-white/10 px-4 py-2">Créatures</a>
        <a href="#team" class="rounded-full bg-white/10 px-4 py-2">Mon équipe · <span id="team-count">0</span>/6</a>
        <a href="#create" class="rounded-full bg-white px-4 py-2 font-bold text-ink">+ Nouvelle créature</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto flex max-w-7xl flex-col gap-8 px-8 py-8">

    <!-- ===================== RECHERCHE ET FILTRES ===================== -->
    <section aria-label="Recherche et filtres" class="flex flex-col gap-4">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <h1 class="font-display text-4xl font-extrabold">Trouver une créature</h1>
        <label class="flex w-full max-w-md flex-col gap-1 text-sm font-bold">
          Rechercher par nom
          <input id="search" type="search" placeholder="ex. Mossling" class="field font-normal">
        </label>
      </div>
      <div id="filters" role="group" aria-label="Filtrer par type" class="flex  flex-wrap gap-2 overflow-auto">
          <button type="button" class="chip  shrink-0">Tous</button>
          <button type="button" class="chip shrink-0">Fire</button>
          <button type="button" class="chip shrink-0">Water</button>
          <button type="button" class="chip shrink-0">Grass</button>
          <button type="button" class="chip shrink-0">Bug</button>
          <button type="button" class="chip shrink-0">Normal</button>
          
      </div>
    </section>

    <div class="flex flex-col md:flex-col lg:flex-col gap-6 xl:flex-row">

      <!-- ===================== GRILLE DES CRÉATURES ===================== -->
      <section id="grid" aria-label="Créatures" class="grid min-w-0 flex-1 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-3  gap-4 sm:gap-5 mb-6">

        <!-- Carte écrite à la main : à remplacer par des cartes générées en JS (Partie 2) -->
         
       

      </section>

      <aside class="grid min-w-0 grid-cols-1 md:w-full  md:grid-cols-2 lg:w-full  lg:grid-cols-2 xl:w-[420px] shrink-0 xl:grid-cols-1 xl:h-[420px] gap-6 ">

        <!-- ===================== PANNEAU DE DÉTAIL ===================== -->
        <section id="detail" aria-label="Détail de la créature" class="flex flex-col gap-4 rounded-card border-2 border-ink bg-white p-6">
          
        </section>

        <!-- ===================== MON ÉQUIPE (INCOMPLÈTE) ===================== -->
        <section  aria-label="Mon équipe" class="rounded-card bg-white ">
          <h2 class="font-display text-2xl font-extrabold p-6">Mon équipe</h2>
          <!-- TODO (Partie 1) : terminez cette section en suivant la maquette :
               compteur x/6, 6 emplacements (vides ou remplis), message de règles. -->
              <div id="team" class="grid min-w-0 flex-1 grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-1 ">
                
                
               </div>
        </section>

      </aside>
    </div>

    <!-- ===================== FORMULAIRE DE CRÉATION ===================== -->
    <section id="create" aria-label="Nouvelle créature" class="flex flex-col gap-6 rounded-card bg-white p-8">
      <div>
        <h2 class="font-display text-3xl font-extrabold">Nouvelle créature</h2>
        <p class="text-muted">Chaque champ est vérifié avant l'ajout de la créature.</p>
      </div>
      <form id="creature-form" novalidate class="grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-4">
        <label class="flex flex-col gap-1 text-sm font-bold">Numéro
          <input name="id" type="text" placeholder="#010" class="field font-normal ">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Nom
          <input name="name" type="text" placeholder="Nom de la créature" class="field font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Type
          <select name="type" class="field font-normal">
            <option value="">Choisir un type</option>
            <option>fire</option><option>water</option><option>grass</option>
            <option>electric</option><option>ice</option><option>fighting</option>
          </select>
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Niveau
          <input name="level" type="text" placeholder="Base, Niveau 1…" class="field font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Statistique 1
          <input name="stat" type="text" placeholder="0 à 999" class="field font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Statistique 2
          <input name="stat" type="text" placeholder="0 à 999" class="field font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Statistique 3
          <input name="stat" type="text" placeholder="0 à 999" class="field font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Lien de l'image
          <input name="image" type="text" placeholder="https://…/image.png" class="field font-normal">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold md:col-span-2 lg:col-span-4">Description
          <textarea name="description" rows="3" placeholder="10 à 200 caractères" class="rounded-xl border-2 border-line p-3 font-normal outline-none"></textarea>
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <div class="flex flex-wrap justify-end gap-3 md:col-span-2 lg:col-span-4">
          <button type="reset" class="btn-outline px-6">Effacer</button>
          <button type="submit" class="btn-primary">Ajouter la créature</button>
        </div>
      </form>
    </section>

  </main>

  <footer class="mx-auto max-w-7xl px-8 pb-10 text-sm text-muted">
    Images : [source des images de votre univers]. Projet de fans réalisé dans le cadre d'une formation.
  </footer>

  <!-- data.js (à créer) doit être chargé AVANT script.js -->
  <script type="module" src="./data.js"></script>
  <script type="module" src="./script.js"></script>
</body>
</html>
